<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reflect">
<meta name="theme-color" content="#0e1116">
<meta name="robots" content="noindex">
<title>Reflect</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0e1116; --ink: #ece6dc; --dim: #8a8f98; --faint: #2a2f38;
    --accent: #c9a96e; --rec: #d9534f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 20px); }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.on { display: flex; }

  .top { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 14px; letter-spacing: .02em; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .3s; }
  .dot.done { background: var(--accent); }
  .dot.now { background: var(--ink); }

  .question { flex: 1; display: flex; align-items: center;
    font-family: ui-serif, "New York", Georgia, serif; font-size: clamp(28px, 8.2vw, 38px); line-height: 1.22;
    padding: 24px 0; transition: opacity .25s; }
  .question.fade { opacity: 0; }

  .bottom { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .rec { width: 92px; height: 92px; border-radius: 50%; border: 2px solid var(--ink); background: transparent;
    display: flex; align-items: center; justify-content: center; padding: 0; }
  .rec i { width: 64px; height: 64px; border-radius: 50%; background: var(--rec); transition: all .2s; }
  .rec.on { border-color: var(--rec); animation: pulse 1.6s ease-in-out infinite; }
  .rec.on i { width: 34px; height: 34px; border-radius: 8px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(217,83,79,.15); } }
  .hint { color: var(--dim); font-size: 15px; height: 20px; font-variant-numeric: tabular-nums; }
  .links { display: flex; gap: 34px; }
  .links button, .link { background: none; border: 0; color: var(--dim); font: inherit; font-size: 16px; padding: 8px; }

  textarea { width: 100%; min-height: 130px; background: #161a21; color: var(--ink); border: 1px solid var(--faint);
    border-radius: 14px; padding: 14px; font: inherit; font-size: 18px; resize: none; }
  .primary { width: 100%; padding: 16px; border-radius: 14px; border: 0; background: var(--ink); color: var(--bg);
    font: inherit; font-weight: 600; font-size: 17px; }
  .primary:disabled { opacity: .4; }
  .ghost { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--faint); background: transparent;
    color: var(--ink); font: inherit; font-size: 17px; }

  .centre { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .big { font-family: ui-serif, "New York", Georgia, serif; font-size: 30px; line-height: 1.25; }
  .small { color: var(--dim); font-size: 15px; }
  input[type=password] { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--faint);
    background: #161a21; color: var(--ink); font: inherit; font-size: 17px; }

  /* v1.2: bigger-reflection scores */
  .lead { font-family: ui-serif, "New York", Georgia, serif; font-size: 26px; line-height: 1.25; margin: 22px 0 6px; }
  .rows { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 12px 0 18px; }
  .row-label { font-size: 15px; color: var(--ink); margin-bottom: 6px; }
  .scale { display: flex; justify-content: space-between; gap: 8px; }
  .scale button { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--faint); background: transparent;
    color: var(--dim); font: inherit; font-size: 17px; font-variant-numeric: tabular-nums; }
  .scale button.on { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .cmp { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .cmp th { text-align: right; color: var(--dim); font-weight: 400; font-size: 13px; padding: 0 0 8px; }
  .cmp th:first-child, .cmp td:first-child { text-align: left; }
  .cmp td { text-align: right; padding: 11px 0; border-top: 1px solid var(--faint); font-size: 17px; }
  .cmp td.f { color: var(--accent); font-weight: 600; width: 64px; }
  .cmp td.l { width: 92px; }
  .cmp .none { color: var(--dim); font-size: 14px; }

  /* v1.3: start menu and fill-ins */
  .items { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .item { width: 100%; text-align: left; padding: 18px 18px 16px; border-radius: 16px; border: 1px solid var(--faint);
    background: #131820; color: var(--ink); font: inherit; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .item .t { font-family: ui-serif, "New York", Georgia, serif; font-size: 23px; line-height: 1.2; }
  .item .s { color: var(--dim); font-size: 14px; margin-top: 4px; }
  .item .n { color: var(--accent); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .item.main { border-color: var(--accent); }
  .note { color: var(--dim); font-size: 14px; text-align: center; min-height: 20px; }
  .count { color: var(--accent); font-variant-numeric: tabular-nums; }
  #q-scale .scale button { height: 58px; font-size: 22px; }
  #q-scale .scale { width: 100%; }
  #q-scale { width: 100%; }
</style>
</head>
<body>

<!-- Password, asked once and kept on this phone only. -->
<section class="screen" id="s-setup">
  <div class="centre">
    <div class="big">Reflect</div>
    <div class="small">Paste your capture password once. It stays on this phone.</div>
    <input type="password" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="primary" id="pw-save">Save</button>
  </div>
</section>

<!-- v1.3: the start menu. Catch up / Fill in / Tonight, each only when it applies. -->
<section class="screen" id="s-menu">
  <div class="top"><span>Reflect</span><span id="m-date"></span></div>
  <div class="items" id="m-items"></div>
  <div class="note" id="m-note"></div>
</section>

<section class="screen" id="s-msg">
  <div class="centre">
    <div class="big" id="msg-big"></div>
    <div class="small" id="msg-small"></div>
    <button class="ghost" id="msg-btn" style="display:none"></button>
  </div>
</section>

<!-- Bigger reflection night: choose it, or just the nightly. -->
<section class="screen" id="s-choose">
  <div class="centre">
    <div class="big" id="choose-title"></div>
    <div class="small" id="choose-sub"></div>
    <button class="primary" id="choose-start">Start</button>
    <button class="ghost" id="choose-nightly">Just the nightly tonight</button>
  </div>
</section>

<!-- v1.2: bigger reflections open with six felt scores, then the comparison with what was logged. -->
<section class="screen" id="s-scores">
  <div class="top"><span id="sc-title"></span><span id="sc-period"></span></div>
  <div class="lead" id="sc-lead">How did it feel?</div>
  <div class="small">1 low · 5 high. Leave any blank to skip it.</div>
  <div class="rows" id="sc-rows"></div>
  <div class="bottom">
    <button class="primary" id="sc-next">Next</button>
    <div class="links"><button id="sc-skip">Skip scores</button></div>
  </div>
</section>

<section class="screen" id="s-compare">
  <div class="top"><span id="cmp-title"></span><span id="cmp-period"></span></div>
  <div class="lead">Felt and logged</div>
  <div class="small" id="cmp-sub"></div>
  <div class="rows"><table class="cmp" id="cmp-table"></table></div>
  <div class="bottom"><button class="primary" id="cmp-next">Continue</button></div>
</section>

<section class="screen" id="s-q">
  <div class="top"><span id="q-title"></span><span class="dots" id="q-dots"></span></div>
  <div class="question" id="q-text"></div>
  <div class="links" id="q-done-row" style="display:none;justify-content:center;margin-bottom:6px"><button id="q-done">Done</button></div>
  <div class="bottom" id="q-scale" style="display:none">
    <div class="scale" id="q-scale-row"></div>
    <div class="links"><button id="q-speak">Speak</button><button id="q-type3">Type</button><button id="q-skip3">Skip</button></div>
  </div>
  <div class="bottom" id="q-voice">
    <div class="hint" id="q-hint">Tap to answer</div>
    <button class="rec" id="q-rec" aria-label="Record"><i></i></button>
    <div class="links"><button id="q-type">Type instead</button><button id="q-skip">Skip</button></div>
  </div>
  <div class="bottom" id="q-typing" style="display:none">
    <textarea id="q-input" placeholder="Type your answer"></textarea>
    <button class="primary" id="q-send">Next</button>
    <div class="links"><button id="q-voice-back">Speak instead</button><button id="q-skip2">Skip</button></div>
  </div>
</section>

<script>
// Reflect v1.3 (24 Nov 2026): opens on the start menu (Reflection Spec 10.6): Catch up (one missed reflection, filed on
// its own day), Fill in (facts the Action Button didn't get; level kinds are 1-5 taps; endless until Done or nothing's
// left; today's count), Tonight. Each is its own session and finishing one returns to the menu.
// Reflect v1.2 (23 Nov 2026): bigger reflections open with six felt scores (1-5), then show felt beside the logged
// average for the period (the logged numbers arrive with the list but stay hidden until the felt scores are in).
// Scores go through the outbox like answers. v1.1 (18 Nov 2026; v1 15 Nov). Talks only to the evening_reflection Edge Function; logic lives in
// "Journal — Reflection Spec". Every answer goes to an outbox on this phone first (IndexedDB) and is sent in the
// background, so nothing waits and nothing is lost offline. An item leaves the outbox only once the server says saved.
const ENDPOINT = "https://lzgfhiwdxqtbbgnvnarm.supabase.co/functions/v1/evening_reflection";
const $ = (id) => document.getElementById(id);
const show = (id) => { document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id)); };
const token = () => localStorage.getItem("reflection_token") || "";

// ---------- Outbox (IndexedDB) ----------
let dbp;
function db() {
  dbp ??= new Promise((res, rej) => {
    const r = indexedDB.open("reflect", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("outbox", { keyPath: "n", autoIncrement: true });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction("outbox", mode); const out = fn(t.objectStore("outbox"));
    t.oncomplete = () => res(out?.result); t.onerror = () => rej(t.error);
  });
}
const outboxAdd = (item) => tx("readwrite", (s) => s.add(item));
const outboxAll = () => tx("readonly", (s) => s.getAll());
const outboxDel = (n) => tx("readwrite", (s) => s.delete(n));

// v1.1 (18 Nov): a failed or stuck item no longer blocks the rest; a session's "finish" waits until every
// earlier answer from that session has gone, so skips are never filed over answers still waiting.
let flushing = null;
function flush() {
  flushing ??= (async () => {
    try {
      const held = new Set();
      for (const item of await outboxAll()) {
        const key = `${item.day}|${item.set}`;
        if (item.kind === "finish" && held.has(key)) continue;
        if (await send(item)) await outboxDel(item.n);
        else held.add(key);
      }
    } finally { flushing = null; }
  })();
  return flushing;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function send(item) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), item.kind === "audio" || item.kind === "fill_audio" ? 60000 : 30000);  // a stuck upload gives up
  try {
    let res;
    if (item.kind === "fill_audio") {
      const f = new FormData();
      f.append("audio", item.blob, `fill_in__${item.fill}.${item.ext}`);
      f.append("action", "fill_in"); f.append("kind", item.fill); f.append("about", item.about.join(","));
      f.append("question", item.question); f.append("recorded_at", item.at);
      res = await fetch(ENDPOINT, { method: "POST", headers: { "x-capture-token": token() }, body: f, signal: ctl.signal });
    } else if (item.kind === "fill") {
      const body = { action: "fill_in", kind: item.fill, about: item.about, question: item.question, text: item.text ?? "", value: item.value ?? null, recorded_at: item.at };
      res = await fetch(ENDPOINT, { method: "POST", headers: { "x-capture-token": token(), "content-type": "application/json" }, body: JSON.stringify(body), signal: ctl.signal });
    } else if (item.kind === "audio") {
      const f = new FormData();
      f.append("audio", item.blob, `${item.day}__${item.set}__${item.prompt}.${item.ext}`);
      f.append("recorded_at", item.at);
      res = await fetch(ENDPOINT, { method: "POST", headers: { "x-capture-token": token() }, body: f, signal: ctl.signal });
    } else {
      const body = item.kind === "text"
        ? { action: "answer", journal_day: item.day, set: item.set, prompt_id: item.prompt, text: item.text, recorded_at: item.at }
        : item.kind === "scores"
        ? { action: "scores", journal_day: item.day, set: item.set, scores: item.scores, recorded_at: item.at }
        : { action: "finish", journal_day: item.day, set: item.set, shown: item.shown };
      res = await fetch(ENDPOINT, { method: "POST", headers: { "x-capture-token": token(), "content-type": "application/json" }, body: JSON.stringify(body), signal: ctl.signal });
    }
    const data = await res.json().catch(() => ({}));
    if (item.kind === "finish" && data.saved) lastFinish = data.message;
    return data.saved === true;
  } catch { return false; }
  finally { clearTimeout(timer); }
}
let lastFinish = "";
const pending = async () => (await outboxAll()).length;

// ---------- Session ----------
let list = null, i = 0, shown = [], mode = "reflect";

async function get(query) {
  const res = await fetch(ENDPOINT + query, { headers: { "x-capture-token": token() } });
  if (res.status === 401) { localStorage.removeItem("reflection_token"); throw new Error("401"); }
  return res.json();
}
function failed(e, retry) {
  if (String(e?.message) === "401") return message("That password didn't work.", "", "Try again", () => show("s-setup"));
  message("Can't reach the server.", "Check your connection.", "Try again", retry);
}

// v1.3: the start menu.
let menuData = null, menuNote = "";
async function menu(note) {
  if (!token()) return show("s-setup");
  if (note !== undefined) menuNote = note;
  const waiting = await pending();
  message(waiting ? `Sending ${waiting} waiting answer${waiting > 1 ? "s" : ""}…` : "…", "");
  await Promise.race([flush(), sleep(15000)]);  // send what's waiting first, but never hold the page up for long
  try { menuData = await get("?menu=true"); } catch (e) { return failed(e, () => menu()); }
  const m = menuData, rows = [];
  if (m.catch_up) rows.push(`<button class="item" data-go="catch"><div><div class="t">${esc(m.catch_up.title.replace(/^Catch up: /, "").replace(/^./, (c) => c.toUpperCase()))}</div><div class="s">Catch up</div></div></button>`);
  if (m.fill_in?.waiting) rows.push(`<button class="item" data-go="fill"><div><div class="t">Fill in</div><div class="s">${m.fill_in.waiting} thing${m.fill_in.waiting > 1 ? "s" : ""} to top up</div></div><div class="n">${m.fill_in.count}</div></button>`);
  if (m.tonight?.status === "ready") rows.push(`<button class="item main" data-go="tonight"><div><div class="t">${esc(m.tonight.title)}</div><div class="s">Tonight</div></div></button>`);
  if (!rows.length) rows.push(`<div class="centre"><div class="big">All done for tonight</div><div class="small">${m.fill_in?.count ?? 0} filled in today</div></div>`);
  $("m-items").innerHTML = rows.join("");
  $("m-items").querySelectorAll("[data-go]").forEach((b) => b.onclick = () => ({ catch: catchUp, fill: fillIn, tonight: () => load(false) })[b.dataset.go]());
  $("m-date").textContent = dayLabel(m.journal_day);
  $("m-note").textContent = menuNote; menuNote = "";
  show("s-menu");
}
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function dayLabel(d) { if (!d) return ""; const [y, mo, da] = d.split("-").map(Number); const w = new Date(Date.UTC(y, mo - 1, da)).getUTCDay(); return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][w]} ${da} ${MONTHS[mo - 1]}`; }

async function catchUp() {
  message("…", "");
  let data; try { data = await get("?catch_up=true"); } catch (e) { return failed(e, catchUp); }
  if (data.status !== "ready" || !data.questions?.length) return menu(data.message || "Nothing to catch up.");
  mode = "reflect"; list = data; i = 0; shown = [];
  begin();
}

// Tonight's reflection.
async function load(nightlyOnly = false) {
  message("…", "");
  let data; try { data = await get(nightlyOnly ? "?nightly_only=true" : ""); } catch (e) { return failed(e, () => load(nightlyOnly)); }
  if (data.status === "done") return menu(data.message);
  if (data.status !== "ready" || !data.questions?.length) return menu("Nothing to ask tonight.");
  mode = "reflect"; list = data; i = 0; shown = [];
  if (data.offer_nightly_only) {
    $("choose-title").textContent = data.title;
    $("choose-sub").textContent = `${data.questions.length} questions`;
    return show("s-choose");
  }
  start();
}

function message(big, small, btn, fn) {
  $("msg-big").textContent = big; $("msg-small").textContent = small || "";
  const b = $("msg-btn"); b.style.display = btn ? "" : "none"; b.textContent = btn || ""; b.onclick = fn || null;
  show("s-msg");
}

// ---------- Scores (v1.2) ----------
let felt = {};
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function period() {
  const a = list.scores_from, b = list.scores_to;
  if (!a || !b) return "";
  const [, am, ad] = a.split("-").map(Number), [, bm, bd] = b.split("-").map(Number);
  return am === bm ? `${ad}–${bd} ${MONTHS[bm - 1]}` : `${ad} ${MONTHS[am - 1]} – ${bd} ${MONTHS[bm - 1]}`;
}
const LEADS = { weekly: "How did the week feel?", monthly: "How did the month feel?", quarterly: "How did the quarter feel?", yearly: "How did the year feel?" };

function begin() { list.scores?.length ? scores() : start(); }

function scores() {
  felt = {};
  $("sc-title").textContent = $("cmp-title").textContent = list.title;
  $("sc-period").textContent = $("cmp-period").textContent = period();
  $("sc-lead").textContent = LEADS[list.set] || "How did it feel?";
  $("sc-rows").innerHTML = list.scores.map((s) =>
    `<div><div class="row-label">${s.label}</div><div class="scale" data-m="${s.measure}">` +
    [1, 2, 3, 4, 5].map((n) => `<button data-n="${n}">${n}</button>`).join("") + `</div></div>`).join("");
  $("sc-rows").querySelectorAll(".scale").forEach((row) => row.onclick = (e) => {
    const n = Number(e.target.dataset?.n); if (!n) return;
    const m = row.dataset.m;
    felt[m] = felt[m] === n ? undefined : n;  // tap again to clear
    row.querySelectorAll("button").forEach((b) => b.classList.toggle("on", Number(b.dataset.n) === felt[m]));
  });
  show("s-scores");
}

async function scoresDone() {
  const given = list.scores.filter((s) => felt[s.measure]).map((s) => ({ measure: s.measure, felt: felt[s.measure] }));
  if (!given.length) return start();
  await outboxAdd({ kind: "scores", day: list.journal_day, set: list.set, scores: given, at: new Date().toISOString() });
  flush();
  $("cmp-table").innerHTML = `<tr><th></th><th>Felt</th><th>Logged</th></tr>` + list.scores.map((s) =>
    `<tr><td>${s.label}</td><td class="f">${felt[s.measure] ?? '<span class="none">–</span>'}</td>` +
    `<td class="l">${s.logged != null ? s.logged.toFixed(1) : '<span class="none">not logged</span>'}</td></tr>`).join("");
  const days = Math.max(0, ...list.scores.map((s) => s.days || 0));
  $("cmp-sub").textContent = days ? `Logged = your average across ${days} day${days > 1 ? "s" : ""} with readings.` : "Nothing was logged in this period.";
  show("s-compare");
}

function start() {
  mode = "reflect"; $("q-done-row").style.display = "none";
  $("q-title").textContent = list.title;
  $("q-dots").innerHTML = list.questions.map(() => '<span class="dot"></span>').join("");
  try { navigator.wakeLock?.request("screen"); } catch {}
  show("s-q"); render();
}

function render() {
  if (mode === "fill") return renderFill();
  const q = list.questions[i];
  $("q-text").textContent = q.text;
  [...$("q-dots").children].forEach((d, k) => { d.className = "dot" + (k < i ? " done" : k === i ? " now" : ""); });
  voiceMode();
}

async function next() {
  if (mode === "fill") return nextFill();
  shown.push(list.questions[i].id);
  i++;
  if (i < list.questions.length) {
    $("q-text").classList.add("fade");
    setTimeout(() => { render(); $("q-text").classList.remove("fade"); }, 180);
    return;
  }
  await outboxAdd({ kind: "finish", day: list.journal_day, set: list.set, shown });
  message("Saving…", "");
  await flush(); await flush();  // the second pass picks up anything added while the first was running
  const left = await pending();
  if (left) message("Saved on your phone.", `${left} item${left > 1 ? "s" : ""} will send next time you open this.`, "Back to the menu", () => menu());
  else menu(lastFinish || "Saved.");
}

function base() { const q = list.questions[i]; return { day: list.journal_day, set: list.set, prompt: q.id, at: new Date().toISOString() }; }

// ---------- Voice ----------
let stream = null, rec = null, chunks = [], t0 = 0, timer = null;
const mime = () => (window.MediaRecorder && MediaRecorder.isTypeSupported?.("audio/mp4")) ? ["audio/mp4", "m4a"] : ["audio/webm", "webm"];

async function toggleRec() {
  if (rec?.state === "recording") return rec.stop();
  try { stream ??= await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { $("q-hint").textContent = "Microphone blocked: type instead"; return; }
  const [type, ext] = mime();
  chunks = []; rec = new MediaRecorder(stream, { mimeType: type });
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    clearInterval(timer); $("q-rec").classList.remove("on");
    const secs = (Date.now() - t0) / 1000;
    if (secs < 1) { $("q-hint").textContent = "Tap to answer"; return; }  // a mis-tap, not an answer
    const blob = new Blob(chunks, { type });
    if (mode === "fill") await outboxAdd({ kind: "fill_audio", ...fillBase(), blob, ext });
    else await outboxAdd({ kind: "audio", ...base(), blob, ext });
    flush(); answered(); next();
  };
  rec.start(); t0 = Date.now(); $("q-rec").classList.add("on");
  const tick = () => { const s = Math.floor((Date.now() - t0) / 1000); $("q-hint").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}  ·  tap when done`; };
  tick(); timer = setInterval(tick, 500);
}

// ---------- Typing ----------
function voiceMode() { $("q-scale").style.display = "none"; $("q-voice").style.display = ""; $("q-typing").style.display = "none"; $("q-hint").textContent = "Tap to answer"; }
function scaleMode() { $("q-scale").style.display = ""; $("q-voice").style.display = "none"; $("q-typing").style.display = "none"; }
function typeMode() {
  $("q-scale").style.display = "none";
  if (rec?.state === "recording") { rec.onstop = null; rec.stop(); clearInterval(timer); $("q-rec").classList.remove("on"); }
  $("q-voice").style.display = "none"; $("q-typing").style.display = ""; $("q-input").value = ""; $("q-input").focus();
}
async function sendTyped() {
  const text = $("q-input").value.trim();
  if (text) {
    if (mode === "fill") await outboxAdd({ kind: "fill", ...fillBase(), text });
    else await outboxAdd({ kind: "text", ...base(), text });
    flush(); answered();
  }
  $("q-input").blur(); next();
}
function skip() {
  if (rec?.state === "recording") { rec.onstop = null; rec.stop(); clearInterval(timer); $("q-rec").classList.remove("on"); }
  next();
}

// ---------- Fill-ins (v1.3) ----------
// Endless round: questions come a few at a time and more are fetched while he answers. Every kind asked this session
// is excluded from later fetches, so a skipped (or still-uploading) kind isn't asked twice. Done ends it any time.
let fq = [], fAsked = new Set(), fCount = 0, fRemaining = 1, fFetching = null, fCur = null;
function fillIn() {
  mode = "fill"; fq = []; fAsked = new Set(); fRemaining = 1; fCur = null;
  fCount = menuData?.fill_in?.count ?? 0;
  $("q-title").textContent = "Fill in"; $("q-done-row").style.display = "";
  show("s-q"); $("q-text").textContent = "Writing your questions…"; $("q-scale").style.display = "none";
  $("q-voice").style.display = "none"; $("q-typing").style.display = "none"; showCount();
  fetchFill().then(() => nextFill(true));
}
function fetchFill() {
  fFetching ??= (async () => {
    try {
      const d = await get(`?fill_in=true&n=3&exclude=${encodeURIComponent([...fAsked, ...fq.map((q) => q.kind)].join(","))}`);
      for (const q of d.questions ?? []) if (!fAsked.has(q.kind) && !fq.some((x) => x.kind === q.kind)) fq.push(q);
      fRemaining = d.remaining ?? 0;
    } catch { fRemaining = 0; }
    finally { fFetching = null; }
  })();
  return fFetching;
}
async function nextFill(first = false) {
  if (!first && fCur) fAsked.add(fCur.kind);
  fCur = null;
  if (!fq.length && fFetching) { $("q-text").textContent = "…"; hideInputs(); await fFetching; }
  if (!fq.length && fRemaining > 0) { $("q-text").textContent = "…"; hideInputs(); await fetchFill(); }
  if (!fq.length) return fillDone(fAsked.size ? "That's everything for now." : "Nothing to fill in right now.");
  fCur = fq.shift(); fAsked.add(fCur.kind);
  if (fq.length < 2 && fRemaining > 0) fetchFill();  // keep a question ready while he answers
  $("q-text").classList.add("fade");
  setTimeout(() => { renderFill(); $("q-text").classList.remove("fade"); }, 180);
}
function hideInputs() { $("q-scale").style.display = "none"; $("q-voice").style.display = "none"; $("q-typing").style.display = "none"; }
function renderFill() {
  if (!fCur) return;
  $("q-text").textContent = fCur.question;
  showCount();
  if (fCur.scale) {
    $("q-scale-row").innerHTML = [1, 2, 3, 4, 5].map((n) => `<button data-n="${n}">${n}</button>`).join("");
    scaleMode();
  } else voiceMode();
}
function showCount() { $("q-dots").innerHTML = `<span class="count">${fCount} today</span>`; }
function fillBase() { return { fill: fCur.kind, about: fCur.about, question: fCur.question, at: new Date().toISOString() }; }
function answered() { if (mode === "fill") { fCount++; showCount(); } }
async function tapScale(e) {
  const n = Number(e.target.dataset?.n); if (!n || !fCur) return;
  e.target.classList.add("on");
  await outboxAdd({ kind: "fill", ...fillBase(), value: n }); flush(); answered();
  setTimeout(() => nextFill(), 150);
}
async function fillDone(note) {
  if (rec?.state === "recording") { rec.onstop = null; rec.stop(); clearInterval(timer); $("q-rec").classList.remove("on"); }
  mode = "reflect"; $("q-done-row").style.display = "none";
  await Promise.race([flush(), sleep(8000)]);
  menu(note);
}

// ---------- Wiring ----------
$("pw-save").onclick = () => { const v = $("pw").value.trim(); if (v) { localStorage.setItem("reflection_token", v); $("pw").value = ""; menu(); } };
$("choose-start").onclick = begin;
$("sc-next").onclick = scoresDone;
$("sc-skip").onclick = start;
$("cmp-next").onclick = start;
$("choose-nightly").onclick = () => load(true);
$("q-scale-row").onclick = tapScale;
$("q-speak").onclick = voiceMode;
$("q-type3").onclick = typeMode;
$("q-skip3").onclick = skip;
$("q-done").onclick = () => fillDone(`${fCount} filled in today.`);
document.addEventListener("visibilitychange", () => { if (!document.hidden && $("s-menu").classList.contains("on")) menu(); });
$("q-rec").onclick = toggleRec;
$("q-type").onclick = typeMode;
$("q-voice-back").onclick = () => (mode === "fill" && fCur?.scale ? scaleMode() : voiceMode());
$("q-skip").onclick = skip;
$("q-skip2").onclick = skip;
$("q-send").onclick = sendTyped;
window.addEventListener("online", flush);
menu();
</script>
</body>
